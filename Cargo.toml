[package]
name = "phonelib"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
authors = ["Mohamad Al Zohbie <alzoubi528@gmail.com>"]
repository = "https://github.com/mohamadzoh/phonelib"
homepage = "https://github.com/mohamadzoh/phonelib"
documentation = "https://docs.rs/phonelib"
description = "A comprehensive library for phone number validation, formatting, parsing, and manipulation"
license = "MIT"
readme = "README.md"
keywords = ["phone", "validation", "phonenumber", "e164", "international"]
categories = ["internationalization", "text-processing", "parsing"]
# `src/*.rs` rather than `src/**/*` deliberately: it ships the library and
# leaves `src/tests/` (~143 KB of test source) out of the published crate. The
# test module is declared `#[cfg(test)]`, so a consumer build never looks for
# it.
include = [
    "src/*.rs",
    "benches/**/*",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]

[lib]
name = "phonelib"
path = "src/lib.rs"

# Intentionally empty, and intentionally without a `[features]` table: the
# library has no dependencies at all and nothing optional to turn on. Adding one
# — even an optional one — would put it in every consumer's dependency graph
# resolution, so it is a deliberate decision, not a convenience.
[dependencies]

# `criterion` is used only by the benchmarks and never reaches a consumer.
[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "phone_benchmark"
harness = false

[[bench]]
name = "parsing_benchmark"
harness = false

[[bench]]
name = "formatting_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1

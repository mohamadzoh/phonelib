name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Test (debug)
        run: cargo test

      # Release is a genuinely different build: overflow checks and
      # `debug_assert!` are off, and the crate's const tables and the LTO
      # profile only get exercised here.
      - name: Test (release)
        run: cargo test --release

      # The README's Rust blocks are compiled and run exactly like doctests, so
      # a documented example can never drift away from the crate.
      - name: README examples
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --lib
          rustdoc --test README.md \
            --edition 2021 \
            --extern phonelib=target/debug/libphonelib.rlib \
            -L dependency=target/debug/deps

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `-- -D warnings` applies to this crate's own targets, not to its
      # dependencies. A job-wide `RUSTFLAGS: -D warnings` would also deny
      # warnings inside criterion and everything under it, so a new compiler
      # release could fail the build over code this crate does not own.
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      # Broken intra-doc links and missing-doc warnings fail the build rather
      # than shipping to docs.rs.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo doc --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the MSRV out of Cargo.toml so this job can never disagree with the
      # `rust-version` the crate publishes.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version" || { echo "rust-version not found in Cargo.toml"; exit 1; }
          # Cargo accepts a two-component `rust-version` ("1.74"), but rustup
          # only resolves a full MAJOR.MINOR.PATCH channel — "1.74" is not a
          # toolchain name — so normalise before handing it over.
          case "$version" in
            *.*.*) ;;
            *.*) version="$version.0" ;;
            *)
              echo "unexpected rust-version in Cargo.toml: $version"
              exit 1
              ;;
          esac
          echo "resolved MSRV toolchain: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Library only. `cargo test` cannot run at the MSRV because the criterion
      # dev-dependency requires a much newer rustc (1.86 at the time of
      # writing); the MSRV is a promise about the library, not about the
      # development tooling.
      #
      # Deliberately without `-D warnings`: this job asks whether the library
      # still *compiles* on the oldest supported toolchain. An old rustc has an
      # older lint set — 1.74's dead-code pass, for one, does not see `const _:
      # () = assert!(..)` as a use — and failing the build over that would say
      # nothing about MSRV compatibility. Warning-freeness is the `test` and
      # `clippy` jobs' business, on stable.
      - run: cargo check --lib
